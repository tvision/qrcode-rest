services:
  php:
    build:
      context: .
      dockerfile: Dockerfile
    image: terravision-qrcode-rest:php8.4.27
    volumes:
      - ./:/var/www/html
    # Re-install deps into the bind mount on start (image vendor is overwritten by volume)
    command: >
      sh -c "composer install --no-interaction --prefer-dist
      && php-fpm -F"
    user: root

  nginx:
    build:
      context: ./docker/nginx
      dockerfile: Dockerfile
    image: terravision-qrcode-rest-nginx:openresty
    ports:
      # ELB/ALB target group tv-qrcode-80 expects host :80
      - "${QRCODE_PORT:-80}:80"
    volumes:
      - ./:/var/www/html:ro
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf:ro
      - ./docker/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - php
